[package]
name = "legio"
version = "0.1.0"
description = "A desktop game launcher for Windows and Linux"
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "legio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
