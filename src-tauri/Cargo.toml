[package]
name = "legio"
version = "0.1.4"
description = "A desktop game launcher for Windows and Linux"
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "legio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
compress-tools = "0.16"
icoextract_rs = "0.1.2"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
steam-client-rs = "0.2.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.5.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
webp = { version = "0.3", default-features = false }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
compress-tools = { version = "0.16", features = ["static"] }
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }
