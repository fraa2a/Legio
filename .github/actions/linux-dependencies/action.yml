name: Install Linux dependencies
description: Install the system packages needed to build the Tauri application, reusing downloaded packages between runs.

inputs:
  extra-packages:
    description: Additional packages to install, separated by spaces.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Refresh package index
      id: plan
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: bash "$GITHUB_ACTION_PATH/packages.sh" plan

    - name: Restore downloaded packages
      id: restore
      if: steps.plan.outputs.count != '0'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/linux-packages
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restore-key }}

    - name: Install packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: bash "$GITHUB_ACTION_PATH/packages.sh" install

    - name: Save downloaded packages
      if: steps.plan.outputs.count != '0' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/linux-packages
        key: ${{ steps.plan.outputs.key }}
