name: Release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: legio-linux
          - name: Windows
            os: windows-latest
            artifact: legio-windows

    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm \
            wget

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Configure Windows archive cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache Windows archive binaries
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKGRS_TRIPLET }}-libarchive-${{ steps.vcpkg-cache.outputs.revision }}-${{ steps.vcpkg-cache.outputs.image }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKGRS_TRIPLET }}-libarchive-${{ steps.vcpkg-cache.outputs.revision }}-

      - name: Install Windows archive library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install libarchive:x64-windows-static-md

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Build Tauri application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            corepack pnpm tauri build --bundles deb,rpm,appimage
          else
            corepack pnpm tauri build --bundles nsis
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    name: Publish release
    permissions:
      contents: write
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out manifest generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were produced."
            exit 1
          fi

          mkdir release-publish
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            name="${name// /.}"
            target="release-publish/$name"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset name: $name"
              exit 1
            fi
            cp -- "$asset" "$target"
          done

          python scripts/release_manifest.py release-publish "$VERSION" "$REPOSITORY"

          (
            cd release-publish
            mapfile -d '' files < <(find . -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
            sha256sum -- "${files[@]}" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          mapfile -d '' files < <(find release-publish -type f -print0 | LC_ALL=C sort -z)

          args=(
            release
            create
            "$TAG"
            --target
            "$TARGET_SHA"
            --title
            "Legio $VERSION"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}" "${files[@]}"

  aur:
    name: Update AUR package
    needs: publish
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare AUR package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          mkdir aur-files
          cp packaging/aur/PKGBUILD packaging/aur/legio-launcher packaging/aur/legio-launcher.desktop src-tauri/icons/icon.png LICENSE aur-files/
          gh release download "$TAG" --pattern '*.AppImage' --dir aur-files
          python scripts/prepare_aur.py aur-files "$VERSION"
          docker run --rm -v "$PWD/aur-files:/work" archlinux:base-devel bash -c \
            "useradd -u $(id -u) -m builder && chown -R builder:builder /work && su builder -c 'cd /work && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo "Missing AUR_SSH_PRIVATE_KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          test -n "$AUR_KNOWN_HOSTS" || { echo "Configure verified AUR_KNOWN_HOSTS before publishing"; exit 1; }
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/legio-launcher-bin.git aur-repo
          cp aur-files/{PKGBUILD,.SRCINFO,legio-launcher,legio-launcher.desktop,LICENSE} aur-repo/
          cd aur-repo
          git config user.name 'Legio release bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm --ignore-unmatch icon.png
          git add PKGBUILD .SRCINFO legio-launcher legio-launcher.desktop LICENSE
          if ! git diff --cached --quiet; then
            git commit -m "Update to $VERSION"
            git push origin HEAD:master
          fi
