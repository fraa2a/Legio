name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Cargo version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          output = os.environ["GITHUB_OUTPUT"]
          before = os.environ["BEFORE_SHA"]

          def write(name, value):
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          manifest = "src-tauri/Cargo.toml"
          if not os.path.isfile(manifest):
              write("release", "false")
              raise SystemExit(0)

          with open(manifest, "rb") as handle:
              current_data = tomllib.load(handle)

          try:
              current = current_data["package"]["version"]
          except KeyError as exc:
              raise SystemExit("src-tauri/Cargo.toml must define package.version") from exc

          try:
              previous_raw = subprocess.check_output(
                  ["git", "show", f"{before}:{manifest}"],
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              write("release", "false")
              raise SystemExit(0)

          previous_data = tomllib.loads(previous_raw.decode("utf-8"))
          try:
              previous = previous_data["package"]["version"]
          except KeyError as exc:
              raise SystemExit("Previous src-tauri/Cargo.toml does not define package.version") from exc

          if current == previous:
              write("release", "false")
              raise SystemExit(0)

          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )

          def parse(value):
              match = semver.fullmatch(value)
              if not match:
                  raise SystemExit(f"Invalid Semantic Version: {value}")
              major, minor, patch, prerelease, _build = match.groups()
              identifiers = prerelease.split(".") if prerelease else None
              return int(major), int(minor), int(patch), identifiers

          def compare_prerelease(left, right):
              if left is None and right is None:
                  return 0
              if left is None:
                  return 1
              if right is None:
                  return -1

              for a, b in zip(left, right):
                  if a == b:
                      continue
                  a_numeric = a.isdigit()
                  b_numeric = b.isdigit()
                  if a_numeric and b_numeric:
                      return 1 if int(a) > int(b) else -1
                  if a_numeric != b_numeric:
                      return -1 if a_numeric else 1
                  return 1 if a > b else -1

              if len(left) == len(right):
                  return 0
              return 1 if len(left) > len(right) else -1

          def compare(left, right):
              left_parsed = parse(left)
              right_parsed = parse(right)

              if left_parsed[:3] != right_parsed[:3]:
                  return 1 if left_parsed[:3] > right_parsed[:3] else -1

              return compare_prerelease(left_parsed[3], right_parsed[3])

          if compare(current, previous) <= 0:
              raise SystemExit(
                  f"Version must increase: {previous} -> {current}"
              )

          tag = f"v{current}"
          tag_check = subprocess.run(
              ["git", "rev-parse", "--quiet", "--verify", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if tag_check.returncode == 0:
              raise SystemExit(f"Tag already exists: {tag}")

          prerelease = parse(current)[3] is not None

          write("release", "true")
          write("version", current)
          write("tag", tag)
          write("prerelease", str(prerelease).lower())
          PY

  quality:
    name: Verify release commit
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: [detect, quality]
    if: needs.detect.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: legio-linux
          - name: Windows
            os: windows-latest
            artifact: legio-windows

    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm \
            wget

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install Windows archive library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install libarchive:x64-windows-static-md

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Build Tauri application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            corepack pnpm tauri build --bundles deb,rpm,appimage
          else
            corepack pnpm tauri build --bundles nsis
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    name: Publish release
    permissions:
      contents: write
    needs:
      - detect
      - build
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out manifest generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were produced."
            exit 1
          fi

          mkdir release-publish
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            name="${name// /.}"
            target="release-publish/$name"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset name: $name"
              exit 1
            fi
            cp -- "$asset" "$target"
          done

          python scripts/release_manifest.py release-publish "$VERSION" "$REPOSITORY"

          (
            cd release-publish
            mapfile -d '' files < <(find . -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
            sha256sum -- "${files[@]}" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          mapfile -d '' files < <(find release-publish -type f -print0 | LC_ALL=C sort -z)

          args=(
            release
            create
            "$TAG"
            --target
            "$TARGET_SHA"
            --title
            "Legio $VERSION"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}" "${files[@]}"

  aur:
    name: Update AUR package
    needs:
      - detect
      - publish
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare AUR package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        shell: bash
        run: |
          mkdir aur-files
          cp packaging/aur/PKGBUILD packaging/aur/legio-launcher packaging/aur/legio-launcher.desktop src-tauri/icons/icon.png LICENSE aur-files/
          gh release download "$TAG" --pattern '*.AppImage' --dir aur-files
          python scripts/prepare_aur.py aur-files "$VERSION"
          docker run --rm -v "$PWD/aur-files:/work" archlinux:base-devel bash -c \
            "useradd -u $(id -u) -m builder && chown -R builder:builder /work && su builder -c 'cd /work && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
          VERSION: ${{ needs.detect.outputs.version }}
        shell: bash
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo "Missing AUR_SSH_PRIVATE_KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          test -n "$AUR_KNOWN_HOSTS" || { echo "Configure verified AUR_KNOWN_HOSTS before publishing"; exit 1; }
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/legio-launcher-bin.git aur-repo
          cp aur-files/{PKGBUILD,.SRCINFO,legio-launcher,legio-launcher.desktop,LICENSE} aur-repo/
          cd aur-repo
          git config user.name 'Legio release bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm --ignore-unmatch icon.png
          git add PKGBUILD .SRCINFO legio-launcher legio-launcher.desktop LICENSE
          if ! git diff --cached --quiet; then
            git commit -m "Update to $VERSION"
            git push origin HEAD:master
          fi
