name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: corepack pnpm check

      - name: Lint frontend
        run: corepack pnpm lint

      - name: Build frontend
        run: corepack pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

  tauri-smoke:
    name: Tauri smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_TRIPLET: x64-windows-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install Windows archive library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install libarchive:x64-windows-static

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Test Windows Steam discovery
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked steam_local::tests::windows_default_roots

      - name: Compare Windows test imports with main
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $testExe = Get-ChildItem src-tauri/target/debug/deps/legio_lib-*.exe | Select-Object -First 1
          Copy-Item $testExe.FullName "$env:RUNNER_TEMP/legio-pr-test.exe"
          $vsPath = vswhere.exe -latest -products '*' -property installationPath
          $vcPath = Get-ChildItem "$vsPath/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = "$($vcPath.FullName)/bin/Hostx64/x64/dumpbin.exe"
          & $dumpbin /imports "$env:RUNNER_TEMP/legio-pr-test.exe" > "$env:RUNNER_TEMP/legio-pr-imports.txt"
          git fetch origin main --depth=1
          $mainPath = "$env:RUNNER_TEMP/legio-main"
          git worktree add --detach $mainPath origin/main
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE/src-tauri/target"
          cargo test --manifest-path "$mainPath/src-tauri/Cargo.toml" --locked steam_local::tests::windows_default_roots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mainExe = Get-ChildItem "$env:CARGO_TARGET_DIR/debug/deps/legio_lib-*.exe" | Select-Object -First 1
          & $dumpbin /imports $mainExe.FullName > "$env:RUNNER_TEMP/legio-main-imports.txt"
          Compare-Object (Get-Content "$env:RUNNER_TEMP/legio-main-imports.txt") (Get-Content "$env:RUNNER_TEMP/legio-pr-imports.txt")

      - name: Build Tauri application
        shell: bash
        run: corepack pnpm tauri build --debug --no-bundle
