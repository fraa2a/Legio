name: CI

on:
  workflow_dispatch:
    inputs:
      test_packages:
        description: Build downloadable Linux and Windows test packages
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - feat/**
      - fix/**
      - refactor/**
      - chore/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks and release
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_plan.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Check local links and images
        run: node --test scripts/test_documentation.mjs

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: corepack pnpm check

      - name: Lint frontend
        run: corepack pnpm lint

      - name: Build frontend
        run: corepack pnpm build

      - name: Test Home calendar and recent games
        run: corepack pnpm test:home

      - name: Test application logging and independent diagnostic toggles
        run: corepack pnpm test:logging

      - name: Test asynchronous stores and artwork cache
        run: corepack pnpm test:regressions

      - name: Test dropdowns, rendering, and shared artwork cache
        run: corepack pnpm test:select && corepack pnpm test:visual && corepack pnpm test:artwork-cache && corepack pnpm test:artwork-work && corepack pnpm test:details-cache

      - name: Test source management and deep links
        run: corepack pnpm test:sources

      - name: Test catalog filters and store controls
        run: corepack pnpm test:catalog

      - name: Check Tauri command permissions
        run: corepack pnpm test:acl

      - name: Test library artwork on cold startup
        run: corepack pnpm test:artwork

      - name: Test theme previews and image lifetime
        run: corepack pnpm test:appearance

      - name: Test window activity and media playback
        run: corepack pnpm test:window

      - name: Test dialogs and notifications
        run: corepack pnpm test:dialog && corepack pnpm test:feedback

      - name: Test onboarding and persistent news
        run: corepack pnpm test:onboarding

      - name: Test review regressions
        run: corepack pnpm test:review

      - name: Test release manifest
        run: python -B -m unittest discover -s scripts

  rust:
    name: Rust
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

  tauri-smoke:
    name: Native checks (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libarchive-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Configure Windows archive cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache Windows archive binaries
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKGRS_TRIPLET }}-libarchive-${{ steps.vcpkg-cache.outputs.revision }}-${{ steps.vcpkg-cache.outputs.image }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKGRS_TRIPLET }}-libarchive-${{ steps.vcpkg-cache.outputs.revision }}-

      - name: Install Windows archive library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install libarchive:x64-windows-static-md

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Test Windows local JSON sources and converted catalogs
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib local_source::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib legio_source::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib legio_source_cache::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib source_catalog::tests

      - name: Test Windows game updates and executable paths
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib game_library::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib game_transfer::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib finalize_install::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib manual_import::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib overlay_update::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib game_updates::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib update_policy

      - name: Test Windows development data isolation
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib app_profile::tests::'

      - name: Test Windows application logging
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib application_log::tests::'

      - name: Test Windows artwork conversion and blur
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib image_trim::tests::'

      - name: Test Windows artwork scheduling, metadata and cache publication
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib artwork_
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib steam_details::tests::
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib steam_assets::tests::

      - name: Test release artwork command stack usage on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib commands::tests::'

      - name: Test Windows WebView diagnostics
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib webview_diagnostics::tests::'

      - name: Test Windows Steam discovery
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib steam_local::tests::windows_default_roots

      - name: Test Windows game process control
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib game_process::tests::'

      - name: Test Windows native lifecycle manager
        if: runner.os == 'Windows'
        shell: bash
        env:
          LEGIO_WINDOWS_TESTS: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib game_lifecycle::tests::native_manager_lifecycle_tracks_a_controlled_process

      - name: Build Tauri application
        if: needs.plan.outputs.release != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_packages)
        shell: bash
        run: corepack pnpm tauri build --debug --no-bundle

      - name: Build Linux test AppImage
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        shell: bash
        run: 'corepack pnpm tauri build --bundles appimage --config ''{"bundle":{"createUpdaterArtifacts":false}}'''

      - name: Record Linux AppImage checksums and revision
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          directory="src-tauri/target/release/bundle/appimage"
          (cd "$directory" && sha256sum -- *.AppImage) > "$directory/SHA256SUMS.txt"
          printf 'Built revision: %s\nSource revision: %s\nTest AppImage. Updater signing is disabled; this is not a published release.\n' \
            "$(git rev-parse HEAD)" "$SOURCE_SHA" > "$directory/build-info.txt"

      - name: Upload Linux test AppImage
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legio-linux-test-${{ github.run_id }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/SHA256SUMS.txt
            src-tauri/target/release/bundle/appimage/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows test installer
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: 'corepack pnpm tauri build --bundles nsis --config ''{"bundle":{"createUpdaterArtifacts":false}}'''

      - name: Record Windows installer checksums and revision
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $directory = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem "$directory/*.exe")
          if ($installers.Count -eq 0) { throw "Windows installer was not produced" }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          $builtRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("Built revision: $builtRevision", "Source revision: $env:SOURCE_SHA", "Test installer. Updater signing is disabled; this is not a published release.") |
            Set-Content "$directory/build-info.txt" -Encoding utf8

      - name: Upload Windows test installer
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legio-windows-test-${{ github.run_id }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload matching Windows native symbols
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.test_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legio-windows-symbols-test-${{ github.run_id }}-${{ github.sha }}
          path: src-tauri/target/release/legio.pdb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [plan, docs, frontend, rust, tauri-smoke]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
    secrets: inherit
